name: Bot Editor & Submit Flow
description: Verify the bot editor loads, accepts code, submits, and shows lobby status
tags: [core, editor, lobby]
preconditions:
  - "Server running at ${QC_BASE_URL}"

scenarios:
  - name: "Editor page loads with Monaco"
    steps:
      - navigate: "${QC_BASE_URL}/static/editor.html"
      - verify: "Monaco code editor is visible with Python syntax highlighting"
      - verify: "Submit Bot button is visible and enabled"
      - check_console: "No errors in console"

  - name: "Editor has template code"
    steps:
      - navigate: "${QC_BASE_URL}/static/editor.html"
      - verify: "Editor contains template code with BOT_NAME, BOT_EMOJI, and decide() function"

  - name: "Submit bot shows lobby status"
    steps:
      - navigate: "${QC_BASE_URL}/static/editor.html"
      - verify: "Editor is loaded with template code"
      - click: "Submit Bot button"
      - wait: "3"
      - verify: "Lobby status panel appears showing player count (e.g. '1/8 players') and countdown timer"
      - verify: "Submit button is disabled during lobby polling"
      - check_console: "No errors in console"

  - name: "Empty source shows error"
    steps:
      - navigate: "${QC_BASE_URL}/static/editor.html"
      - fill:
          field: "Monaco editor"
          value: ""
      - click: "Submit Bot button"
      - wait: "2"
      - verify: "Error message appears indicating source is empty or invalid"

  - name: "localStorage preserves bot code"
    steps:
      - navigate: "${QC_BASE_URL}/static/editor.html"
      - fill:
          field: "Monaco editor"
          value: "BOT_NAME = 'TestQC'\nBOT_EMOJI = 'Q'\ndef decide(state): return ('rest',)"
      - click: "Submit Bot button"
      - wait: "2"
      - navigate: "${QC_BASE_URL}/static/editor.html"
      - verify: "Editor contains previously submitted code (TestQC)"
