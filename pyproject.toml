[project]
name = "agent-grounds"
version = "0.2.0"
description = "Competitive bot arena platform"
authors = [{name = "Five Dollar Fridays"}]
requires-python = ">=3.13"
license = "MIT"
readme = "README.md"
keywords = ["game", "coding-game", "battle-royale", "python", "bots", "agent-arena"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
]
dependencies = []

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn>=0.34", "redis>=5.0"]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.28",
    "ruff>=0.14",
    "mypy>=1.19",
    "pyyaml>=6.0",
    "discord.py>=2.3",
    "Pillow>=10.0",
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.0",
    "websockets>=13.0",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "redis>=5.0",
]
realtime = ["websockets>=13.0"]
discord = ["discord.py>=2.3"]
video = ["Pillow>=10.0"]
youtube = ["google-api-python-client>=2.0", "google-auth-oauthlib>=1.0"]

[project.scripts]
agentgrounds = "agentgrounds.__main__:main"

[project.urls]
Homepage = "https://github.com/fivedollarfridays/npc-wars"
Repository = "https://github.com/fivedollarfridays/npc-wars"
Issues = "https://github.com/fivedollarfridays/npc-wars/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentgrounds*", "engine*", "data*", "scripts*", "discord_bot*", "video*", "youtube*", "realtime*", "server*", "tv*"]

[tool.setuptools.package-data]
"agentgrounds.wars.data" = ["*.md"]
"agentgrounds.wars.builtin_bots" = ["*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 130
exclude = [".claude", ".paircoder"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E701",  # Multiple statements on one line — intentional compact bot dispatch style
]

[tool.ruff.lint.per-file-ignores]
"scripts/publish_match.py" = ["E402"]  # sys.path.insert before project imports
"youtube/auth.py" = ["E402"]  # logging setup before google imports

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true
