version: "3.8"

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - RESULTS_DIR=/data/results
      - DB_PATH=/data/npcwars.db
      - NPCWARS_CORS_ORIGINS=*
    volumes:
      - npcwars-data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build: .
    command: python -m server.worker
    environment:
      - REDIS_URL=redis://redis:6379
      - RESULTS_DIR=/data/results
    volumes:
      - npcwars-data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "print('ok')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  npcwars-data:
  redis-data:
