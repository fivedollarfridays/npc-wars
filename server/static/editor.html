<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPC Wars — Bot Editor</title>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-tertiary: #1a1a2e;
            --text-primary: #e0e0e0;
            --text-secondary: #8888aa;
            --accent: #ff4444;
            --accent-glow: #ff444466;
            --success: #44ff88;
            --warning: #ffaa44;
            --border: #2a2a3e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        header h1 {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        header h1 span {
            color: var(--accent);
        }

        #editor-container {
            flex: 1;
            min-height: 0;
        }

        #controls {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
        }

        #submit-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 10px 28px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: box-shadow 0.2s, opacity 0.2s;
        }

        #submit-btn:hover {
            box-shadow: 0 0 16px var(--accent-glow);
        }

        #submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #lobby-status {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        #lobby-status.active {
            color: var(--warning);
        }

        #errors {
            background: var(--bg-tertiary);
            border-top: 1px solid var(--border);
            max-height: 120px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        #errors:empty {
            display: none;
        }

        .error-item {
            padding: 6px 24px;
            font-size: 0.85rem;
            color: var(--accent);
            font-family: 'Cascadia Code', 'Fira Code', monospace;
            border-bottom: 1px solid var(--border);
        }

        #match-link {
            background: var(--bg-tertiary);
            border-top: 1px solid var(--border);
            padding: 12px 24px;
            flex-shrink: 0;
            display: none;
        }

        #match-link a {
            color: var(--success);
            text-decoration: none;
            font-weight: 600;
        }

        #match-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <h1>NPC <span>WARS</span> — Bot Editor</h1>
        <div id="lobby-status">Lobby: waiting for players...</div>
    </header>

    <div id="editor-container"></div>

    <div id="controls">
        <button id="submit-btn" type="button">Submit Bot</button>
    </div>

    <div id="errors"></div>
    <div id="match-link" style="display:none">
        <a id="match-link-anchor" href="#">View Match Result</a>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.47.0/min/vs/loader.min.js"></script>
    <script>
        const BOT_TEMPLATE = [
            'BOT_NAME = "MyBot"',
            'BOT_EMOJI = "\\ud83e\\udd16"',
            'BOT_BIO = "My custom bot"',
            '',
            '',
            'def decide(state):',
            '    me = state["me"]',
            '    enemies = state["enemies"]',
            '    # Your strategy here',
            '    return ("rest",)',
            ''
        ].join('\n');

        let editor = null;

        // Load Monaco Editor
        require.config({
            paths: {
                vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.47.0/min/vs'
            }
        });

        require(['vs/editor/editor.main'], function () {
            monaco.editor.defineTheme('npcwars', {
                base: 'vs-dark',
                inherit: true,
                rules: [],
                colors: {
                    'editor.background': '#0a0a0f',
                    'editor.foreground': '#e0e0e0',
                    'editorLineNumber.foreground': '#555570',
                    'editor.selectionBackground': '#2a2a4e',
                    'editor.lineHighlightBackground': '#12121a'
                }
            });

            // Pre-fill from localStorage if available
            var savedSource = localStorage.getItem('lastBotSource');
            var initialValue = savedSource || BOT_TEMPLATE;

            editor = monaco.editor.create(
                document.getElementById('editor-container'),
                {
                    value: initialValue,
                    language: 'python',
                    theme: 'npcwars',
                    fontSize: 14,
                    fontFamily: "'Cascadia Code', 'Fira Code', 'Consolas', monospace",
                    minimap: { enabled: false },
                    scrollBeyondLastLine: false,
                    automaticLayout: true,
                    lineNumbers: 'on',
                    renderWhitespace: 'selection',
                    tabSize: 4,
                    insertSpaces: true
                }
            );
        });

        // Clear inline error markers
        function clearErrors() {
            const errorsDiv = document.getElementById('errors');
            errorsDiv.innerHTML = '';
            if (editor) {
                monaco.editor.setModelMarkers(editor.getModel(), 'submission', []);
            }
        }

        // Display errors inline in the editor and in the errors panel
        function showErrors(errors) {
            const errorsDiv = document.getElementById('errors');
            errorsDiv.innerHTML = '';

            const markers = [];

            errors.forEach(function (err) {
                // Add to error panel
                const item = document.createElement('div');
                item.className = 'error-item';
                item.textContent = err;
                errorsDiv.appendChild(item);

                // Try to extract line number from error message
                const lineMatch = err.match(/line\s+(\d+)/i);
                const lineNum = lineMatch ? parseInt(lineMatch[1], 10) : 1;

                markers.push({
                    severity: monaco.MarkerSeverity.Error,
                    message: err,
                    startLineNumber: lineNum,
                    startColumn: 1,
                    endLineNumber: lineNum,
                    endColumn: 1000
                });
            });

            if (editor) {
                monaco.editor.setModelMarkers(editor.getModel(), 'submission', markers);
            }
        }

        // Submit bot source to the server
        function submitBot() {
            if (!editor) return;

            var btn = document.getElementById('submit-btn');
            btn.disabled = true;
            clearErrors();

            var source = editor.getValue();
            localStorage.setItem('lastBotSource', source);

            fetch('/api/submit-bot', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ source: source })
            })
            .then(function (resp) {
                return resp.json().then(function (data) {
                    return { status: resp.status, data: data };
                });
            })
            .then(function (result) {
                if (result.status === 400 && result.data.errors) {
                    btn.disabled = false;
                    showErrors(result.data.errors);
                } else if (result.status === 429) {
                    btn.disabled = false;
                    showErrors([result.data.detail || 'Rate limited. Try again later.']);
                } else if (result.status === 202) {
                    var lobbyEl = document.getElementById('lobby-status');
                    lobbyEl.textContent = 'Submitted! Waiting for match...';
                    lobbyEl.classList.add('active');
                    startLobbyPolling();
                }
            })
            .catch(function (err) {
                btn.disabled = false;
                showErrors(['Network error: ' + err.message]);
            });
        }

        // Poll /api/lobby/status every 2s for real lobby state
        var _pollInterval = null;

        function startLobbyPolling() {
            var lobbyEl = document.getElementById('lobby-status');
            var btn = document.getElementById('submit-btn');
            btn.disabled = true;

            _pollInterval = setInterval(function () {
                fetch('/api/lobby/status')
                .then(function (resp) { return resp.json(); })
                .then(function (data) {
                    updateLobbyUI(data);
                    if (data.match_id) {
                        clearInterval(_pollInterval);
                        _pollInterval = null;
                        lobbyEl.textContent = 'Match starting...';
                        setTimeout(function () {
                            window.location.href = '/viewer?match=' + data.match_id;
                        }, 1000);
                    }
                })
                .catch(function () {
                    lobbyEl.textContent = 'Lobby: connection lost, retrying...';
                });
            }, 2000);
        }

        function updateLobbyUI(data) {
            var lobbyEl = document.getElementById('lobby-status');
            var parts = [];
            parts.push(data.players + '/' + data.max + ' players');
            if (data.time_remaining !== null) {
                parts.push(Math.ceil(data.time_remaining) + 's remaining');
            }
            lobbyEl.textContent = parts.join(' | ');

            // Show player_list
            var names = (data.player_list || []).map(function (p) {
                return p.emoji + ' ' + p.name;
            });
            if (names.length > 0) {
                lobbyEl.textContent += ' | ' + names.join(', ');
            }
        }

        // Wire up submit button
        document.getElementById('submit-btn').addEventListener('click', submitBot);
    </script>
</body>
</html>
