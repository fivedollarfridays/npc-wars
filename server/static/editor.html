<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPC Wars — Bot Editor</title>
    <link rel="stylesheet" href="/static/css/lobby.css">
    <link rel="stylesheet" href="/static/css/responsive.css">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-tertiary: #1a1a2e;
            --text-primary: #e0e0e0;
            --text-secondary: #8888aa;
            --accent: #ff4444;
            --accent-glow: #ff444466;
            --success: #44ff88;
            --warning: #ffaa44;
            --border: #2a2a3e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        header h1 {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        header h1 span {
            color: var(--accent);
        }

        #editor-container {
            flex: 1;
            min-height: 0;
        }

        #controls {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
        }

        #submit-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 10px 28px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: box-shadow 0.2s, opacity 0.2s;
        }

        #submit-btn:hover {
            box-shadow: 0 0 16px var(--accent-glow);
        }

        #submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #lobby-status {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        #lobby-status.active {
            color: var(--warning);
        }

        #errors {
            background: var(--bg-tertiary);
            border-top: 1px solid var(--border);
            max-height: 120px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        #errors:empty {
            display: none;
        }

        .error-item {
            padding: 6px 24px;
            font-size: 0.85rem;
            color: var(--accent);
            font-family: 'Cascadia Code', 'Fira Code', monospace;
            border-bottom: 1px solid var(--border);
        }

        #match-link {
            background: var(--bg-tertiary);
            border-top: 1px solid var(--border);
            padding: 12px 24px;
            flex-shrink: 0;
            display: none;
        }

        #match-link a {
            color: var(--success);
            text-decoration: none;
            font-weight: 600;
        }

        #match-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="mobile-banner">
        Code editing works best on desktop
        <button class="close-btn" aria-label="Dismiss">&times;</button>
    </div>
    <script src="/static/js/mobile-banner.js"></script>
    <header>
        <h1>NPC <span>WARS</span> — Bot Editor</h1>
        <div id="lobby-status">Lobby: waiting for players...</div>
        <span id="graduated-badge" style="display:none; color: #ffd700; font-size: 0.9em; margin-left: 12px;">&#127942; Graduated</span>
    </header>

    <div id="editor-container"></div>

    <div id="controls">
        <button id="submit-btn" type="button">Submit Bot</button>
        <div id="tier-select-wrapper" style="display:none; margin-left: 16px;">
            <label for="tier-select" style="color: #888; font-size: 0.85em;">Challenge Tier:</label>
            <select id="tier-select" style="background: #1a1a2e; color: #ccc; border: 1px solid #333; padding: 4px 8px; border-radius: 4px;">
                <option value="">Auto (current tier)</option>
                <option value="1">Tier 1: The Bully</option>
                <option value="2">Tier 2: The Storm Chaser</option>
                <option value="3">Tier 3: The Economist</option>
                <option value="4">Tier 4: The Counter</option>
                <option value="5">Tier 5: The Mirror</option>
            </select>
        </div>
    </div>

    <div id="lobby-panel" style="display:none;">
        <div class="lobby-header">
            <span id="lobby-title">Waiting for players</span>
            <span class="pulse-dots">...</span>
        </div>
        <div id="lobby-players" class="lobby-player-grid"></div>
        <div class="lobby-countdown">
            <div class="progress-bar">
                <div id="countdown-fill" class="progress-fill"></div>
            </div>
            <span id="countdown-text"></span>
        </div>
    </div>

    <div id="errors"></div>
    <div id="match-link" style="display:none">
        <a id="match-link-anchor" href="#">View Match Result</a>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.47.0/min/vs/loader.min.js"></script>
    <script src="/static/js/lobby.js"></script>
    <script>
        const BOT_TEMPLATE = [
            'BOT_NAME = "MyBot"',
            'BOT_EMOJI = "\\ud83e\\udd16"',
            'BOT_BIO = "My custom bot"',
            '',
            '',
            'def decide(state):',
            '    me = state["me"]',
            '    enemies = state["enemies"]',
            '    # Your strategy here',
            '    return ("rest",)',
            ''
        ].join('\n');

        let editor = null;

        // Load Monaco Editor
        require.config({
            paths: {
                vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.47.0/min/vs'
            }
        });

        require(['vs/editor/editor.main'], function () {
            monaco.editor.defineTheme('npcwars', {
                base: 'vs-dark',
                inherit: true,
                rules: [],
                colors: {
                    'editor.background': '#0a0a0f',
                    'editor.foreground': '#e0e0e0',
                    'editorLineNumber.foreground': '#555570',
                    'editor.selectionBackground': '#2a2a4e',
                    'editor.lineHighlightBackground': '#12121a'
                }
            });

            // Pre-fill from localStorage if available
            var savedSource = localStorage.getItem('lastBotSource');
            var initialValue = savedSource || BOT_TEMPLATE;

            editor = monaco.editor.create(
                document.getElementById('editor-container'),
                {
                    value: initialValue,
                    language: 'python',
                    theme: 'npcwars',
                    fontSize: 14,
                    fontFamily: "'Cascadia Code', 'Fira Code', 'Consolas', monospace",
                    minimap: { enabled: false },
                    scrollBeyondLastLine: false,
                    automaticLayout: true,
                    lineNumbers: 'on',
                    renderWhitespace: 'selection',
                    tabSize: 4,
                    insertSpaces: true
                }
            );
        });

        // Clear inline error markers
        function clearErrors() {
            const errorsDiv = document.getElementById('errors');
            errorsDiv.innerHTML = '';
            if (editor) {
                monaco.editor.setModelMarkers(editor.getModel(), 'submission', []);
            }
        }

        // Display errors inline in the editor and in the errors panel
        function showErrors(errors) {
            const errorsDiv = document.getElementById('errors');
            errorsDiv.innerHTML = '';

            const markers = [];

            errors.forEach(function (err) {
                // Add to error panel
                const item = document.createElement('div');
                item.className = 'error-item';
                item.textContent = err;
                errorsDiv.appendChild(item);

                // Try to extract line number from error message
                const lineMatch = err.match(/line\s+(\d+)/i);
                const lineNum = lineMatch ? parseInt(lineMatch[1], 10) : 1;

                markers.push({
                    severity: monaco.MarkerSeverity.Error,
                    message: err,
                    startLineNumber: lineNum,
                    startColumn: 1,
                    endLineNumber: lineNum,
                    endColumn: 1000
                });
            });

            if (editor) {
                monaco.editor.setModelMarkers(editor.getModel(), 'submission', markers);
            }
        }

        // Submit bot source to the server
        function submitBot() {
            if (!editor) return;

            var btn = document.getElementById('submit-btn');
            btn.disabled = true;
            clearErrors();

            var source = editor.getValue();
            localStorage.setItem('lastBotSource', source);

            fetch('/api/submit-bot', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ source: source })
            })
            .then(function (resp) {
                return resp.json().then(function (data) {
                    return { status: resp.status, data: data };
                });
            })
            .then(function (result) {
                if (result.status === 400 && result.data.detail) {
                    btn.disabled = false;
                    var detail = result.data.detail;
                    showErrors(Array.isArray(detail) ? detail : [detail]);
                } else if (result.status === 429) {
                    btn.disabled = false;
                    showErrors([result.data.detail || 'Rate limited. Try again later.']);
                } else if (result.status === 202) {
                    var lobbyEl = document.getElementById('lobby-status');
                    lobbyEl.textContent = 'Submitted! Waiting for match...';
                    lobbyEl.classList.add('active');
                    startLobbyPolling();
                }
            })
            .catch(function (err) {
                btn.disabled = false;
                showErrors(['Network error: ' + err.message]);
            });
        }

        // Wire up submit button
        document.getElementById('submit-btn').addEventListener('click', submitBot);

        // Check graduation status for badge + tier select
        (function() {
            var key = localStorage.getItem('api_key');
            if (!key) return;
            fetch('/api/rival/graduated', {headers: {'X-API-Key': key}})
                .then(function(r) { return r.json(); })
                .then(function(d) {
                    if (d.graduated) {
                        var badge = document.getElementById('graduated-badge');
                        if (badge) badge.style.display = '';
                        var sel = document.getElementById('tier-select-wrapper');
                        if (sel) sel.style.display = '';
                    }
                })
                .catch(function() {});
        })();
    </script>
</body>
</html>
