<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kill Switch</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Silkscreen:wght@400;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0a0f;
    --surface: #13131f;
    --border: #1e1e33;
    --text: #e0e0f0;
    --muted: #6a6a8a;
    --accent: #ff3e6c;
    --accent2: #00e5ff;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  .hero {
    text-align: center;
    margin-bottom: 60px;
  }
  .hero h1 {
    font-family: 'Silkscreen', cursive;
    font-size: 48px;
    letter-spacing: 6px;
    text-transform: uppercase;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 12px;
  }
  .hero .tagline {
    color: var(--muted);
    font-size: 14px;
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .nav-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    max-width: 760px;
    width: 100%;
  }
  .nav-card {
    display: block;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 28px 24px;
    text-decoration: none;
    color: var(--text);
    transition: border-color 0.2s, transform 0.2s;
  }
  .nav-card:hover {
    border-color: var(--accent2);
    transform: translateY(-2px);
  }
  .nav-card .card-icon {
    font-size: 28px;
    margin-bottom: 12px;
  }
  .nav-card .card-title {
    font-family: 'Silkscreen', cursive;
    font-size: 16px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent2);
    margin-bottom: 8px;
  }
  .nav-card .card-desc {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.6;
  }
  .nav-card:hover .card-title { color: var(--accent); }
  .profile-link {
    margin-top: 40px;
    display: none;
  }
  .profile-link a {
    color: var(--accent2);
    text-decoration: none;
    font-size: 13px;
    letter-spacing: 1px;
  }
  .profile-link a:hover {
    color: var(--accent);
    text-decoration: underline;
  }
</style>
</head>
<body>
<div class="hero">
  <h1>Kill Switch</h1>
  <div class="tagline">You don't play. You code.</div>
</div>
<div class="nav-grid">
  <a href="/static/editor.html" class="nav-card">
    <div class="card-icon">&gt;_</div>
    <div class="card-title">Quick Play</div>
    <div class="card-desc">Write a bot, drop into the arena, and fight.</div>
  </a>
  <a href="/tournaments" class="nav-card">
    <div class="card-icon">&#9876;</div>
    <div class="card-title">Tournaments</div>
    <div class="card-desc">Compete in bracket-style elimination events.</div>
  </a>
  <a href="/leaderboard" class="nav-card">
    <div class="card-icon">&#9733;</div>
    <div class="card-title">Leaderboard</div>
    <div class="card-desc">See who ranks highest across all matches.</div>
  </a>
</div>
<div class="profile-link" id="profile-link">
  <a id="profile-href" href="/profile/">My Profile</a>
</div>
<script>
  (function() {
    var key = localStorage.getItem('api_key');
    var botId = localStorage.getItem('bot_id');
    if (key && botId) {
      var el = document.getElementById('profile-link');
      var a = document.getElementById('profile-href');
      a.href = '/profile/' + encodeURIComponent(botId);
      el.style.display = 'block';
    }
  })();
</script>
</body>
</html>
